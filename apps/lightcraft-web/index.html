<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LightCraft</title>
  <link rel="icon" href="data:,">
  <meta name="description" content="LightCraft: open-source photo library and raw developer, running in your browser (WASM).">
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #1c1c1c; }
    canvas#lightcraft_canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    #lightcraft_loading {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      color: #b8b8b8; font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; pointer-events: none;
    }
    #lightcraft_status { position: absolute; left: 0; bottom: 0; width: 1px; height: 1px; overflow: hidden; }
  </style>
</head>
<body>
  <canvas id="lightcraft_canvas"></canvas>
  <div id="lightcraft_loading">Loading LightCraft…</div>
  <div id="lightcraft_status" aria-live="polite"></div>
  <script type="module">
    import init, { start, command } from "./lightcraft_web.js";
    (async () => {
      // The Chinese font is a separate file: embedding it would exceed the host's WASM size limit.
      // Font-free development builds can still run, with the same missing-glyph warning as before.
      const chineseFont = fetch("./lightcraft_zh_hans.otf", { cache: "no-store" })
        .then(async response => {
          if (!response.ok) return new Uint8Array();
          const b = new Uint8Array(await response.arrayBuffer());
          return (b.length > 4 && b[0] !== 60) ? b : new Uint8Array();
        })
        .catch(() => new Uint8Array());
      // Compile once; the render workers (worker.js) instantiate the same compiled module.
      const [module, font] = await Promise.all([
        WebAssembly.compileStreaming(fetch("./lightcraft_web_bg.wasm")),
        chineseFont,
      ]);
      globalThis.lightcraftModule = module;
      await init({ module_or_path: module });
      // automation: `await lightcraft.command("library.info", "{}")` → JSON text
      globalThis.lightcraft = { command };
      globalThis.lightcraftAiRetouch = async (reqJson) => {
        try {
          const req = JSON.parse(reqJson || "{}");
          const base = (req.endpoint || "/api/ai/v1").replace(/\/+$/, "");
          const model = req.model || "gemini-4-argon-medium";
          let apiKey = (req.apiKey || "").trim();
          if (apiKey) {
            try { localStorage.setItem("lightcraft_ai_api_key", apiKey); } catch (_) {}
          } else {
            try { apiKey = (localStorage.getItem("lightcraft_ai_api_key") || "").trim(); } catch (_) {}
          }
          const headers = { "Content-Type": "application/json" };
          if (apiKey) {
            headers["Authorization"] = "Bearer " + apiKey;
          }
          const userGoal = (req.prompt && req.prompt.trim())
            ? req.prompt.trim()
            : "Auto-retouch this portrait for natural high-end skin texture, balanced shine and under-eye circles, bright eyes, and flattering 3D contour.";
          const sysPrompt =
            "You are the LightCraft & Evoto.ai AI Studio Assistant. " +
            "You can edit ANYTHING in the photo (Light, White Balance, Color, Effects, Detail, B&W Treatment, and all 25 Portrait Retouch sliders). " +
            "Given the portrait/image telemetry and user chat instruction, return ONLY a valid JSON object (no markdown outside JSON) with keys: " +
            "{\"retouch\":{\"skinSmooth\":0..100,\"skinTexture\":0..100,\"skinToneEven\":0..100,\"shineControl\":0..100," +
            "\"darkCircles\":0..100,\"wrinkleReduce\":0..100,\"skinRadiance\":-100..100,\"skinWarmth\":-100..100," +
            "\"skinRedness\":-100..100,\"eyeBrighten\":0..100,\"eyeWhiten\":0..100,\"eyeClarity\":0..100," +
            "\"eyebrowEnhance\":-100..100,\"teethWhiten\":0..100,\"lipEnhance\":-100..100,\"lipMoisture\":0..100," +
            "\"faceContour\":0..100,\"faceSlim\":-100..100,\"eyeEnlarge\":-100..100,\"noseSlim\":-100..100," +
            "\"chinLength\":-100..100,\"smileLift\":-100..100,\"hairLuster\":0..100,\"strayHair\":0..100}," +
            "\"light\":{\"exposure\":-3.0..3.0,\"contrast\":-100..100,\"highlights\":-100..100,\"shadows\":-100..100,\"whites\":-100..100,\"blacks\":-100..100}," +
            "\"wb\":{\"temp\":-100..100,\"tint\":-100..100}," +
            "\"color\":{\"vibrance\":-100..100,\"saturation\":-100..100}," +
            "\"effects\":{\"texture\":-100..100,\"clarity\":-100..100,\"dehaze\":-100..100,\"vignette\":-100..100,\"grain\":0..100}," +
            "\"detail\":{\"sharpness\":0..150,\"nrLuminance\":0..100}," +
            "\"treatment\":\"color\"|\"bw\"," +
            "\"summary\":\"Conversational 1-sentence reply explaining what you adjusted in the image\"}";
          const historyText = Array.isArray(req.history) && req.history.length
            ? "\nRecent Chat:\n" + req.history.map(m => `${m.role}: ${m.content}`).join("\n")
            : "";
          const userMsg =
            "Image Telemetry & Current Settings:\n" +
            JSON.stringify(req.telemetry?.analysis || req.telemetry || {}) +
            historyText +
            "\n\nUser Chat Request: " + userGoal +
            "\n\nRespond ONLY with the JSON object.";
          const imageDataUrl = (req.telemetry && typeof req.telemetry.imageDataUrl === "string")
            ? req.telemetry.imageDataUrl
            : "";
          const userContent = imageDataUrl
            ? [
                { type: "text", text: userMsg },
                { type: "image_url", image_url: { url: imageDataUrl } }
              ]
            : userMsg;
          const resp = await fetch(base + "/chat/completions", {
            method: "POST",
            headers,
            body: JSON.stringify({
              model,
              stream: false,
              response_format: { type: "json_object" },
              messages: [
                { role: "system", content: sysPrompt },
                { role: "user", content: userContent }
              ]
            })
          });
          if (!resp.ok) {
            const errTxt = await resp.text().catch(() => String(resp.status));
            await command("retouch.aiDone", JSON.stringify({ error: "HTTP " + resp.status + ": " + errTxt.slice(0, 160) }));
            return;
          }
          const data = await resp.json();
          const content = data?.choices?.[0]?.message?.content || "";
          if (content) {
            await command("retouch.aiApply", JSON.stringify({
              response: content,
              prompt: req.prompt || "",
              allSelected: !!req.allSelected
            }));
          } else {
            await command("retouch.aiDone", JSON.stringify({ error: "Empty completion response" }));
          }
        } catch (err) {
          await command("retouch.aiDone", JSON.stringify({ error: String(err) }));
        }
      };
      start(font);
    })().catch((e) => {
      console.error(e);
      const el = document.getElementById("lightcraft_loading");
      if (el) el.textContent = "LightCraft failed to load: " + e;
    });
  </script>
</body>
</html>
