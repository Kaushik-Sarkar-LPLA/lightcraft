<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LightCraft</title>
  <link rel="icon" href="data:,">
  <meta name="description" content="LightCraft: open-source photo library and raw developer, running in your browser (WASM).">
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #1c1c1c; }
    canvas#lightcraft_canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    #lightcraft_loading {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      color: #b8b8b8; font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; pointer-events: none;
    }
    #lightcraft_status { position: absolute; left: 0; bottom: 0; width: 1px; height: 1px; overflow: hidden; }
  </style>
</head>
<body>
  <canvas id="lightcraft_canvas"></canvas>
  <div id="lightcraft_loading">Loading LightCraft…</div>
  <div id="lightcraft_status" aria-live="polite"></div>
  <script type="module">
    import init, { start, command } from "./lightcraft_web.js";
    (async () => {
      // The Chinese font is a separate file: embedding it would exceed the host's WASM size limit.
      // Font-free development builds can still run, with the same missing-glyph warning as before.
      const chineseFont = fetch("./lightcraft_zh_hans.otf", { cache: "no-store" })
        .then(async response => {
          if (!response.ok) return new Uint8Array();
          const b = new Uint8Array(await response.arrayBuffer());
          return (b.length > 4 && b[0] !== 60) ? b : new Uint8Array();
        })
        .catch(() => new Uint8Array());
      // Compile once; the render workers (worker.js) instantiate the same compiled module.
      const [module, font] = await Promise.all([
        WebAssembly.compileStreaming(fetch("./lightcraft_web_bg.wasm")),
        chineseFont,
      ]);
      globalThis.lightcraftModule = module;
      await init({ module_or_path: module });
      // automation: `await lightcraft.command("library.info", "{}")` → JSON text
      globalThis.lightcraft = { command };
      fetch("/api/ai/v1/models", { cache: "no-store" })
        .then(r => r.ok ? r.json() : null)
        .then(d => {
          if (d && Array.isArray(d.data) && d.data.length) {
            command("retouch.aiModels", JSON.stringify({ models: d.data })).catch(() => {});
          }
        })
        .catch(() => {});
      globalThis.lightcraftAiRetouch = async (reqJson) => {
        let req = {};
        try {
          req = JSON.parse(reqJson || "{}");
          const base = (req.endpoint || "/api/ai/v1").replace(/\/+$/, "");
          const model = req.model || "gemini-4-argon-medium";
          let apiKey = (req.apiKey || "").trim();
          if (apiKey) {
            try { localStorage.setItem("lightcraft_ai_api_key", apiKey); } catch (_) {}
          } else {
            try { apiKey = (localStorage.getItem("lightcraft_ai_api_key") || "").trim(); } catch (_) {}
          }
          const headers = { "Content-Type": "application/json" };
          if (apiKey) {
            headers["Authorization"] = "Bearer " + apiKey;
          }
          const userGoal = (req.prompt && req.prompt.trim())
            ? req.prompt.trim()
            : "Auto-retouch this portrait: analyze the subject's skin, lighting, eyes, teeth, facial structure, and body proportions, and dial in natural high-end retouching and tone balance.";
          const sysPrompt =
            "You are the LightCraft AI Studio Director (powered by Gemini Vision), an expert portrait/body retoucher, colorist, and photography assistant.\n" +
            "Return ONLY a single valid JSON object (no markdown fences outside JSON).\n\n" +
            "1. CONVERSATION / Q&A MODE:\n" +
            "If the user is greeting you, asking a question about the photo (composition, lighting critique, skin analysis, EXIF/camera details, editing advice), or chatting without asking to modify settings, return:\n" +
            "{\"mode\":\"chat\",\"reply\":\"Your detailed, intelligent, helpful response.\"}\n\n" +
            "2. EDIT & RETOUCH MODE:\n" +
            "If the user asks to adjust, retouch, reshape, color-grade, crop, or transform anything in the image, return:\n" +
            "{\"mode\":\"edit\",\"reply\":\"Natural, specific explanation of what you observed and adjusted\", ...ONLY the setting groups/keys you want to change...}\n" +
            "CRITICAL RULES:\n" +
            "- Include ONLY the specific sliders you are changing! Do NOT include untouched sliders or set unmentioned sliders to 0, so existing edits on the photo are preserved.\n" +
            "- Answer directly in ONE single turn using the provided portraitAnalysis, meta, and currentSettings telemetry whenever possible; only call view_file on an attached image if the user explicitly asks about visual scene content (clothing, background objects, composition) not present in the telemetry.\n\n" +
            "Available setting groups & slider ranges (include only keys you are modifying):\n" +
            "- \"actions\": optional array from [\"reset\", \"autoRetouch\", \"healBlemishes\"]\n" +
            "- \"retouch\": {\n" +
            "    \"skinSmooth\":0..100, \"skinTexture\":0..100, \"skinToneEven\":0..100, \"shineControl\":0..100, \"darkCircles\":0..100, \"wrinkleReduce\":0..100,\n" +
            "    \"skinRadiance\":-100..100, \"skinWarmth\":-100..100, \"skinRedness\":-100..100,\n" +
            "    \"eyeBrighten\":0..100, \"eyeWhiten\":0..100, \"eyeClarity\":0..100, \"eyebrowEnhance\":-100..100,\n" +
            "    \"teethWhiten\":0..100, \"lipEnhance\":-100..100, \"lipMoisture\":0..100,\n" +
            "    \"faceContour\":0..100, \"faceSlim\":-100..100, \"eyeEnlarge\":-100..100, \"noseSlim\":-100..100, \"chinLength\":-100..100, \"smileLift\":-100..100,\n" +
            "    \"bodySlim\":-100..100, \"waistSlim\":-100..100, \"stomachFlat\":0..100, \"hipEnhance\":-100..100, \"shoulderWidth\":-100..100, \"armSlim\":-100..100, \"neckSlim\":-100..100, \"chestEnhance\":-100..100, \"legLength\":-100..100,\n" +
            "    \"hairLuster\":0..100, \"strayHair\":0..100\n" +
            "  }\n" +
            "- \"light\": {\"exposure\":-4.0..4.0, \"contrast\":-100..100, \"highlights\":-100..100, \"shadows\":-100..100, \"whites\":-100..100, \"blacks\":-100..100}\n" +
            "- \"wb\": {\"temp\":-100..100, \"tint\":-100..100}\n" +
            "- \"color\": {\"vibrance\":-100..100, \"saturation\":-100..100}\n" +
            "- \"grading\": {\"shadows\":{\"hue\":0..360,\"sat\":0..100,\"lum\":-100..100}, \"midtones\":{\"hue\":0..360,\"sat\":0..100,\"lum\":-100..100}, \"highlights\":{\"hue\":0..360,\"sat\":0..100,\"lum\":-100..100}}\n" +
            "- \"mixer\": {\"red\":{\"hue\":-100..100,\"sat\":-100..100,\"lum\":-100..100}, \"orange\":{...}, \"yellow\":{...}, \"green\":{...}, \"aqua\":{...}, \"blue\":{...}, \"purple\":{...}, \"magenta\":{...}}\n" +
            "- \"effects\": {\"texture\":-100..100, \"clarity\":-100..100, \"dehaze\":-100..100, \"vignette\":-100..100, \"grain\":0..100}\n" +
            "- \"detail\": {\"sharpness\":0..150, \"nrLuminance\":0..100, \"nrColor\":0..100}\n" +
            "- \"crop\": {\"aspect\":\"1:1\"|\"4:5\"|\"16:9\"|\"9:16\"|\"3:2\"|\"5:7\"|\"original\", \"angle\":-45..45, \"flipH\":bool, \"flipV\":bool}\n" +
            "- \"treatment\": \"color\"|\"bw\"";
          const tel = req.telemetry || {};
          const contextObj = {
            fileName: tel.fileName || "",
            meta: tel.meta || {},
            portraitAnalysis: tel.analysis || {},
            currentSettings: tel.current || {}
          };
          const historyText = Array.isArray(req.history) && req.history.length
            ? "\nConversation History:\n" + req.history.map(m => `${m.role}: ${m.content}`).join("\n")
            : "";
          const userMsg =
            "Photo Telemetry & Current Active Settings:\n" +
            JSON.stringify(contextObj) +
            historyText +
            "\n\nUser Message: " + userGoal +
            "\n\nRespond ONLY with the JSON object.";
          const imageDataUrl = (tel && typeof tel.imageDataUrl === "string")
            ? tel.imageDataUrl
            : "";
          const userContent = imageDataUrl
            ? [
                { type: "text", text: userMsg },
                { type: "image_url", image_url: { url: imageDataUrl } }
              ]
            : userMsg;
          const resp = await fetch(base + "/chat/completions", {
            method: "POST",
            headers,
            body: JSON.stringify({
              model,
              stream: false,
              response_format: { type: "json_object" },
              messages: [
                { role: "system", content: sysPrompt },
                { role: "user", content: userContent }
              ]
            })
          });
          if (!resp.ok) {
            const errTxt = await resp.text().catch(() => String(resp.status));
            await command("retouch.aiDone", JSON.stringify({
              error: "HTTP " + resp.status + ": " + errTxt.slice(0, 160),
              prompt: req.prompt || "",
              allSelected: !!req.allSelected
            }));
            return;
          }
          const data = await resp.json();
          const content = data?.choices?.[0]?.message?.content || "";
          if (content) {
            await command("retouch.aiApply", JSON.stringify({
              response: content,
              prompt: req.prompt || "",
              allSelected: !!req.allSelected,
              blemishNote: req.blemishNote || ""
            }));
          } else {
            await command("retouch.aiDone", JSON.stringify({
              error: "Empty completion response",
              prompt: req.prompt || "",
              allSelected: !!req.allSelected
            }));
          }
        } catch (err) {
          await command("retouch.aiDone", JSON.stringify({
            error: String(err),
            prompt: req.prompt || "",
            allSelected: !!req.allSelected
          }));
        }
      };
      start(font);
    })().catch((e) => {
      console.error(e);
      const el = document.getElementById("lightcraft_loading");
      if (el) el.textContent = "LightCraft failed to load: " + e;
    });
  </script>
</body>
</html>
